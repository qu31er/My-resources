<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0616">
<title>Мои ресурсы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob-wrap">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <button class="settings-btn" id="btnSettings" title="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.5 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 8.5a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09A1.65 1.65 0 009 3.6V3a2 2 0 114 0v.09A1.65 1.65 0 0015.5 3.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09A1.65 1.65 0 0020.4 9H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>

  <main class="glass-card">
    <h1 class="title">Мои ресурсы</h1>
    <p class="subtitle">выбери, куда отправиться</p>

    <nav class="links">
      <a href="https://t.me/killer2017official" class="bubble" data-key="telegram" style="--d:0s" target="_blank" rel="noopener">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M21 4L3 11l6 2 2 6 3-4 5 3z"/>
          </svg>
        </span>
        <span class="text">Telegram</span>
        <span class="glow"></span>
      </a>

      <a href="https://discord.com/channels/1530662235351810119/1530662236887056530" class="bubble" data-key="discord" style="--d:.08s" target="_blank" rel="noopener">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M8 5v8a4 4 0 004 4h4"/>
            <circle cx="6" cy="5" r="2.2"/>
            <circle cx="18" cy="19" r="2.2"/>
          </svg>
        </span>
        <span class="text">Discord</span>
        <span class="glow"></span>
      </a>

      <a href="https://github.com/qu31er" class="bubble" data-key="github" style="--d:.16s" target="_blank" rel="noopener">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M9 19c-4 1.2-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.3 4.3 0 00-.1-3.2s-1-.3-3.3 1.2a11 11 0 00-6 0C7 3 6 3.3 6 3.3a4.3 4.3 0 00-.1 3.2A4.6 4.6 0 004.5 9.7c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>
          </svg>
        </span>
        <span class="text">GitHub</span>
        <span class="glow"></span>
      </a>
    </nav>

    <section class="player" id="player">
      <div class="player-glow"></div>

      <div class="player-head">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-ring"></div>
          <div class="vinyl-center"></div>
        </div>
        <div class="track-info">
          <div class="track-name" id="trackName">Трек не выбран</div>
          <div class="track-sub" id="trackSub">загрузи MP3 или выбери из плейлиста</div>
        </div>
      </div>

      <div class="seek" id="seek">
        <div class="seek-fill" id="seekFill"></div>
        <div class="seek-knob" id="seekKnob"></div>
      </div>
      <div class="time-row">
        <span id="timeCur">0:00</span>
        <span id="timeDur">0:00</span>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btnPrev" title="Предыдущий трек">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M11 5L4 12l7 7M20 5l-7 7 7 7"/>
          </svg>
        </button>

        <button class="ctrl-btn play" id="btnPlay" title="Играть">
          <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5l12 7-12 7z"/>
          </svg>
          <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor">
            <rect x="7" y="5" width="4" height="14" rx="1"/>
            <rect x="13" y="5" width="4" height="14" rx="1"/>
          </svg>
        </button>

        <button class="ctrl-btn" id="btnNext" title="Следующий трек">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M13 5l7 7-7 7M4 5l7 7-7 7"/>
          </svg>
        </button>

        <button class="ctrl-btn repeat" id="btnRepeat" title="Повтор одного трека">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11V9a4 4 0 014-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
          <span class="repeat-one">1</span>
        </button>
      </div>

      <div class="player-bottom">
        <div class="vol-wrap">
          <svg class="vol-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M11 5L6 9H3v6h3l5 4z"/>
            <path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/>
          </svg>
          <input type="range" class="vol" id="vol" min="0" max="1" step="0.01" value="1">
        </div>

        <label class="upload-btn" for="fileInput" title="Загрузить MP3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 4v12M6 10l6-6 6 6M4 20h16"/>
          </svg>
          <span>Загрузить</span>
          <input type="file" id="fileInput" accept="audio/*" hidden>
        </label>
      </div>

      <button class="playlist-toggle" id="btnPlaylist" title="Плейлист">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 6h11M4 12h11M4 18h7"/>
          <circle cx="18" cy="16" r="2.5"/>
          <path d="M20.5 16V9l-4 1"/>
        </svg>
        <span>Плейлист</span>
        <span class="pl-count" id="plCount">0</span>
      </button>

      <div class="playlist" id="playlist">
        <div class="pl-empty" id="plEmpty">Пока пусто — загрузи первый трек</div>
        <ul class="pl-list" id="plList"></ul>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>

  <div class="ctx-backdrop" id="ctxBackdrop"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-handle"></div>
    <button class="ctx-item" data-action="open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M14 4h6v6M20 4l-9 9M10 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-4"/>
      </svg>
      <span>Открыть</span>
    </button>
    <button class="ctx-item" data-action="copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <path d="M5 15V5a2 2 0 012-2h10"/>
      </svg>
      <span>Копировать ссылку</span>
    </button>
    <button class="ctx-item" data-action="newtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M9 15l6-6M10 9h5v5"/>
      </svg>
      <span>Открыть в новой вкладке</span>
    </button>
    <div class="ctx-divider"></div>
    <button class="ctx-item ctx-danger" data-action="hide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.1A10.5 10.5 0 0112 5c5 0 9 4.5 9 7a11 11 0 01-2.2 3.3M6.2 6.4A11 11 0 003 12c0 2.5 4 7 9 7a10.5 10.5 0 003.6-.6"/>
      </svg>
      <span>Скрыть</span>
    </button>
  </div>

  <div class="settings-modal" id="settingsModal">
    <div class="settings-backdrop" data-close-settings></div>
    <div class="settings-window">
      <button class="settings-close" data-close-settings title="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>

      <h2 class="settings-title">Настройки интерфейса</h2>

      <div class="settings-row">
        <label>R</label>
        <input type="range" id="rngR" min="0" max="255" value="160">
        <span class="settings-val" id="valR">160</span>
      </div>

      <div class="settings-row">
        <label>G</label>
        <input type="range" id="rngG" min="0" max="255" value="68">
        <span class="settings-val" id="valG">68</span>
      </div>

      <div class="settings-row">
        <label>B</label>
        <input type="range" id="rngB" min="0" max="255" value="255">
        <span class="settings-val" id="valB">255</span>
      </div>

      <div class="settings-row">
        <label>☀</label>
        <input type="range" id="rngBright" min="40" max="140" value="100">
        <span class="settings-val" id="valBright">100%</span>
      </div>

      <div class="settings-hex">
        <span>HEX:</span>
        <input type="text" id="hexInput" value="#A044FF" maxlength="7" spellcheck="false">
      </div>

      <div class="settings-presets">
        <button class="preset" data-r="123" data-g="47" data-b="247" style="background:#7b2ff7"></button>
        <button class="preset" data-r="160" data-g="68" data-b="255" style="background:#a044ff"></button>
        <button class="preset" data-r="255" data-g="60" data-b="130" style="background:#ff3c82"></button>
        <button class="preset" data-r="60" data-g="200" data-b="255" style="background:#3cc8ff"></button>
        <button class="preset" data-r="60" data-g="230" data-b="120" style="background:#3ce678"></button>
        <button class="preset" data-r="255" data-g="180" data-b="60" style="background:#ffb43c"></button>
      </div>

      <button class="settings-reset" id="btnSettingsReset">Сбросить</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
